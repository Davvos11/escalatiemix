server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;
    # Relative redirects: behind Traefik the container's own port must not leak into Location.
    absolute_redirect off;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /escalatie {
        return 301 /escalatie/;
    }

    # App build from the image; the large media (mixes/, centimerion/, pianoman.mp4) are
    # gitignored and live on the `media` volume, mounted at /srv/media/escalatie.
    location /escalatie/ {
        try_files $uri $uri/ @media;
    }

    location @media {
        root /srv/media;
    }
}
