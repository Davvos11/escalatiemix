apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: escalatie
spec:
  parentRefs:
    - name: public
      namespace: gateway
  hostnames:
    - dovatvis.nl
    - www.dovatvis.nl
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /escalatie
      backendRefs:
        - name: escalatie
          port: 80
